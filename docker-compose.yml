version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travel_ai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: travel_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_ai_network

  redis:
    image: redis:7-alpine
    container_name: travel_ai_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_ai_network

volumes:
  postgres_data:
  redis_data:

networks:
  travel_ai_network:
    driver: bridge
